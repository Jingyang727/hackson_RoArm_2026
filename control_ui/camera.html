<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EvoArm · 俯视相机</title>
<style>
:root {font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#101827;color:#e6edf8}
*{box-sizing:border-box}body{margin:24px auto;padding:0 18px;max-width:950px}
h1{font-size:24px;margin:0 0 4px}a{color:#8adfca}small,.muted{color:#a4b2c8}
main{margin-top:18px;background:#1a293f;border:1px solid #384864;border-radius:14px;padding:18px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:10px 0 16px}
button,select{background:#334461;color:#eff5fd;border:1px solid #65738a;padding:9px 12px;border-radius:8px}
button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}
#stage{position:relative;background:#0a1320;border:1px solid #465775;border-radius:10px;overflow:hidden}
video{display:block;width:100%;max-height:65vh;object-fit:contain}
#stage:before,#stage:after{content:"";position:absolute;pointer-events:none;opacity:.6;background:#42e6ba}
#stage:before{width:1px;height:100%;left:50%;top:0}#stage:after{width:100%;height:1px;top:50%;left:0}
.info{padding:10px 12px;border-radius:8px;background:#283850;margin-top:12px;line-height:1.7}
.warning{background:#392a2b;border:1px solid #805454;padding:12px;border-radius:8px;margin-top:12px}
</style>
</head>
<body>
<a href="/">← 返回机械臂状态控制台</a>
<h1>EvoArm · 俯视摄像头预览</h1>
<small>仅用于相机安装和取景检查，不读取或发送机械臂运动指令。</small>
<main>
  <div class="row">
    <label for="devices">摄像头</label>
    <select id="devices" aria-label="摄像头"></select>
    <button id="start">启动预览</button>
    <button id="stop" disabled>关闭摄像头</button>
    <button id="shot" disabled>保存一帧 PNG</button>
  </div>
  <div id="stage"><video id="video" autoplay muted playsinline></video></div>
  <div class="info">
    <div id="result" role="status">未启动摄像头。点击“启动预览”，并允许浏览器访问摄像头。</div>
    <div class="muted">十字线仅用于取景辅助，不是坐标标定结果。拍照保存的是原始画面，不附带十字线。</div>
  </div>
  <div class="warning">安装前先断开机械臂运动电源，确保相机支架不在机械臂的扫掠范围内，移走显示器等易损物品。这里只开启摄像头，不会自动抓取。</div>
</main>
<script>
const $=id=>document.getElementById(id);
let stream=null;
function note(message){$("result").textContent=message}
async function listCameras(currentId=""){
  if(!navigator.mediaDevices?.enumerateDevices){note("浏览器不支持摄像头 API；请使用 Chrome 或 Safari 的本地地址");return}
  const devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==="videoinput");
  const choice=$("devices");choice.replaceChildren();
  devices.forEach((d,i)=>{
    const opt=document.createElement("option");
    opt.value=d.deviceId;opt.textContent=d.label||("摄像头 "+(i+1));
    choice.append(opt);
  });
  if(currentId && devices.some(d=>d.deviceId===currentId))choice.value=currentId;
  if(!devices.length)note("没有检测到摄像头，请检查 USB 连接或 macOS 权限");
}
function stopCamera(){
  if(stream){for(const track of stream.getTracks())track.stop();stream=null}
  $("video").srcObject=null;
  $("stop").disabled=true;$("shot").disabled=true;
  $("start").disabled=false;
}
async function startCamera(){
  if(!navigator.mediaDevices?.getUserMedia)throw Error("浏览器无法访问摄像头；请从 http://127.0.0.1:8765/camera 打开");
  stopCamera();
  const id=$("devices").value;
  const video={width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}};
  if(id)video.deviceId={exact:id};
  stream=await navigator.mediaDevices.getUserMedia({video,audio:false});
  const element=$("video");element.srcObject=stream;
  await element.play();
  $("stop").disabled=false;$("shot").disabled=false;$("start").disabled=true;
  const selected=stream.getVideoTracks()[0];
  await listCameras(selected.getSettings().deviceId||id);
  note("预览中 · "+element.videoWidth+"×"+element.videoHeight+
       " · "+(selected.getSettings().frameRate||"未知")+" FPS（设备报告值）");
}
$("start").onclick=async()=>{try{await startCamera()}catch(e){stopCamera();note("打开摄像头失败："+e.message+"。检查系统隐私权限或其他软件占用。")}};
$("stop").onclick=()=>{stopCamera();note("摄像头已关闭")};
$("shot").onclick=()=>{
  if(!stream || !$("video").videoWidth)return;
  const v=$("video"),canvas=document.createElement("canvas");
  canvas.width=v.videoWidth;canvas.height=v.videoHeight;
  canvas.getContext("2d").drawImage(v,0,0);
  canvas.toBlob(blob=>{
    if(!blob){note("截图失败");return}
    const a=document.createElement("a");const url=URL.createObjectURL(blob);
    a.href=url;a.download="evoarm-overhead-"+new Date().toISOString().replace(/[:.]/g,"-")+".png";
    a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  },"image/png");
};
$("devices").onchange=async()=>{if(stream){try{await startCamera()}catch(e){stopCamera();note("切换失败："+e.message)}}};
window.addEventListener("pagehide",stopCamera);
listCameras().catch(e=>note("设备枚举失败："+e.message));
</script>
</body>
</html>
