<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EvoArm · 俯视相机</title>
<style>
:root {font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#101827;color:#e6edf8}
*{box-sizing:border-box}body{margin:24px auto;padding:0 18px;max-width:950px}
h1{font-size:24px;margin:0 0 4px}a{color:#8adfca}small,.muted{color:#a4b2c8}
main{margin-top:18px;background:#1a293f;border:1px solid #384864;border-radius:14px;padding:18px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:10px 0 16px}
button,select{background:#334461;color:#eff5fd;border:1px solid #65738a;padding:9px 12px;border-radius:8px}
button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}
#stage{position:relative;background:#0a1320;border:1px solid #465775;border-radius:10px;overflow:hidden}
video{display:block;width:100%;max-height:65vh;object-fit:contain}
#stage:before,#stage:after{content:"";position:absolute;pointer-events:none;opacity:.6;background:#42e6ba}
#stage:before{width:1px;height:100%;left:50%;top:0}#stage:after{width:100%;height:1px;top:50%;left:0}
.info{padding:10px 12px;border-radius:8px;background:#283850;margin-top:12px;line-height:1.7}
.warning{background:#392a2b;border:1px solid #805454;padding:12px;border-radius:8px;margin-top:12px}
#analysisCanvas{width:100%;height:auto;background:#0b1321;border-radius:8px;display:block;margin-top:12px}
#analysisDetails{white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}
input{background:#243650;color:white;border:1px solid #65738a;border-radius:7px;padding:9px;width:115px}
</style>
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body>
<a href="/">← 返回机械臂状态控制台</a> · <a href="/calibration">机械臂坐标标定 →</a>
<h1>EvoArm · 俯视摄像头预览</h1>
<small>仅用于相机安装和取景检查，不读取或发送机械臂运动指令。</small>
<main>
  <div class="row">
    <label for="devices">摄像头</label>
    <select id="devices" aria-label="摄像头"></select>
    <button id="start">启动预览</button>
    <button id="stop" disabled>关闭摄像头</button>
    <button id="shot" disabled>保存一帧 PNG</button>
  </div>
  <div class="row">
    <label for="squareSize">棋盘单格边长（mm）</label>
    <input id="squareSize" type="number" min="0.1" max="200" step="0.1" placeholder="请实测"/>
    <button id="analyze" disabled>检测棋盘格和黄色球</button>
  </div>
  <small>不填边长也能检测，但只能得到棋盘格单位；填写实际尺寸后才计算毫米坐标。</small>
  <div id="stage"><video id="video" autoplay muted playsinline></video></div>
  <div class="info">
    <div id="result" role="status">未启动摄像头。点击“启动预览”，并允许浏览器访问摄像头。</div>
    <div class="muted">十字线仅用于取景辅助，不是坐标标定结果。拍照保存的是原始画面，不附带十字线。</div>
  </div>
  <div id="analysisBox" style="display:none">
    <h2>单帧检测结果（非机械臂坐标）</h2>
    <div id="analysisDetails" class="info" aria-live="polite"></div>
    <canvas id="analysisCanvas"></canvas>
  </div>
  <details class="safety-details"><summary>视觉结果说明</summary><p class="muted">图像坐标不是机械臂坐标。未建立基座映射、球心高度和路径验证前，不可自动抓取；棋盘外的坐标仅为外推估算。</p></details>
</main>
<script>
const $=id=>document.getElementById(id);
let stream=null;
function note(message){$("result").textContent=message}
async function listCameras(currentId=""){
  if(!navigator.mediaDevices?.enumerateDevices){note("浏览器不支持摄像头 API；请使用 Chrome 或 Safari 的本地地址");return}
  const devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==="videoinput");
  const choice=$("devices");choice.replaceChildren();
  devices.forEach((d,i)=>{
    const opt=document.createElement("option");
    opt.value=d.deviceId;opt.textContent=d.label||("摄像头 "+(i+1));
    choice.append(opt);
  });
  if(currentId && devices.some(d=>d.deviceId===currentId))choice.value=currentId;
  if(!devices.length)note("没有检测到摄像头，请检查 USB 连接或 macOS 权限");
}
function stopCamera(){
  if(stream){for(const track of stream.getTracks())track.stop();stream=null}
  $("video").srcObject=null;
  $("stop").disabled=true;$("shot").disabled=true;$("analyze").disabled=true;
  $("start").disabled=false;
}
async function startCamera(){
  if(!navigator.mediaDevices?.getUserMedia)throw Error("浏览器无法访问摄像头；请从 http://127.0.0.1:8765/camera 打开");
  stopCamera();
  const id=$("devices").value;
  // Prefer true 1920x1080 capture (not browser-side image upscaling).
  const video={width:{exact:1920},height:{exact:1080},frameRate:{ideal:30}};
  if(id)video.deviceId={exact:id};
  let fallback=false;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video,audio:false});
  }catch(err){
    // Keep preview usable on webcams that do not expose 1080p in this browser.
    if(err.name!=="OverconstrainedError" && err.name!=="NotFoundError")throw err;
    const lower={width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}};
    if(id)lower.deviceId={exact:id};
    stream=await navigator.mediaDevices.getUserMedia({video:lower,audio:false});
    fallback=true;
  }
  const element=$("video");element.srcObject=stream;
  await element.play();
  $("stop").disabled=false;$("shot").disabled=false;$("analyze").disabled=false;$("start").disabled=true;
  const selected=stream.getVideoTracks()[0];
  await listCameras(selected.getSettings().deviceId||id);
  const actual=element.videoWidth+"×"+element.videoHeight;
  note("预览中 · 实际 "+actual+
       " · "+(selected.getSettings().frameRate||"未知")+" FPS（设备报告值）"+
       (fallback||actual!=="1920×1080"?"；当前未获得1080p，可能是设备/浏览器模式限制":"；已启用1080p采集"));
}
$("start").onclick=async()=>{try{await startCamera()}catch(e){stopCamera();note("打开摄像头失败："+e.message+"。检查系统隐私权限或其他软件占用。")}};
$("stop").onclick=()=>{stopCamera();note("摄像头已关闭")};
function captureFrame(){
 if(!stream||!$("video").videoWidth)throw Error("摄像头还未开始预览");
 const v=$("video"),canvas=document.createElement("canvas");
 canvas.width=v.videoWidth;canvas.height=v.videoHeight;
 canvas.getContext("2d").drawImage(v,0,0);
 return canvas;
}
$("analyze").onclick=async()=>{
 $("analyze").disabled=true;
 try{
  const squareText=$("squareSize").value.trim();
  const squareMM=squareText?Number(squareText):null;
  if(squareMM!==null&&(!Number.isFinite(squareMM)||squareMM<=0||squareMM>200))
    throw Error("单格边长必须是0到200mm之间的正数");
  const snapshot=captureFrame();
  note("正在分析单帧棋盘格和黄色球；机械臂不会运动...");
  const blob=await new Promise(resolve=>snapshot.toBlob(resolve,"image/png"));
  if(!blob)throw Error("无法创建PNG截图");
  const query=squareMM!==null?"?square_mm="+encodeURIComponent(squareMM):"";
  const response=await fetch("/api/vision/analyze"+query,{
    method:"POST",headers:{"Content-Type":"image/png"},body:blob
  });
  const data=await response.json();
  if(!response.ok)throw Error(data.detail||"HTTP "+response.status);
  const box=$("analysisBox"),view=$("analysisCanvas"),ctx=view.getContext("2d");
  box.style.display="block";view.width=snapshot.width;view.height=snapshot.height;
  ctx.drawImage(snapshot,0,0);
  if(data.checkerboard?.detected){
   ctx.fillStyle="#00eeae";
   for(const [x,y] of data.checkerboard.corners_px){
     ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();
   }
  }
  if(data.ball?.detected){
   const [x,y]=data.ball.center_px;
   ctx.strokeStyle="#f22a68";ctx.lineWidth=5;
   ctx.beginPath();ctx.arc(x,y,Math.max(10,data.ball.radius_px),0,Math.PI*2);ctx.stroke();
   ctx.beginPath();ctx.moveTo(x-12,y);ctx.lineTo(x+12,y);
   ctx.moveTo(x,y-12);ctx.lineTo(x,y+12);ctx.stroke();
   ctx.font="28px sans-serif";ctx.fillStyle="#f22a68";
   ctx.fillText("Yellow ball ("+x.toFixed(0)+", "+y.toFixed(0)+")",Math.min(x+26,view.width-440),Math.max(y-20,40));
  }
  const board=data.checkerboard?.detected
    ?"棋盘格：9×6，角点"+data.checkerboard.corners_count+"个。"
    :"棋盘格：未检出。";
  const ball=data.ball?.detected
    ?"黄色球：像素坐标 ("+data.ball.center_px.join(", ")+")，直径约"+(2*data.ball.radius_px).toFixed(1)+"px。"
    :"黄色球：未检出。";
  const grid=data.ball?.board_grid_xy
    ?"棋盘相对坐标："+data.ball.board_grid_xy.join(", ")+"格"+
      (data.ball.board_mm_xy?"；约 ("+data.ball.board_mm_xy.join(", ")+")mm":"")+
      (data.ball.inside_inner_board?"（角点范围内）":"（超出角点范围，外推仅供参考）")
    :"";
  $("analysisDetails").textContent=[
   "实际图像："+data.image.width+"×"+data.image.height,board,ball,grid,
   ...data.warnings.map(w=>"注意："+w)
  ].filter(Boolean).join("\n");
  note("分析完成：下方已显示带标记的截图。");
 }catch(err){
  $("analysisBox").style.display="block";
  $("analysisDetails").textContent="分析失败："+err.message;
  note("分析失败："+err.message);
 }finally{$("analyze").disabled=!stream}
};
$("shot").onclick=()=>{
  if(!stream || !$("video").videoWidth)return;
  const canvas=captureFrame();
  canvas.toBlob(blob=>{
    if(!blob){note("截图失败");return}
    const a=document.createElement("a");const url=URL.createObjectURL(blob);
    a.href=url;a.download="evoarm-overhead-"+new Date().toISOString().replace(/[:.]/g,"-")+".png";
    a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  },"image/png");
};
$("devices").onchange=async()=>{if(stream){try{await startCamera()}catch(e){stopCamera();note("切换失败："+e.message)}}};
window.addEventListener("pagehide",stopCamera);
(async()=>{
 try{
   await listCameras();
   if(navigator.permissions?.query){
     const permission=await navigator.permissions.query({name:"camera"});
     if(permission.state==="granted"&&!stream)await startCamera();
   }
 }catch(e){note("相机自动预览未启动："+e.message+"；可手动点击启动预览")}
})();
</script>
</body>
</html>
