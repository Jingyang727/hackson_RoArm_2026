<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>EvoArm · 试验记录</title>
    <link rel="stylesheet" href="/assets/workspace.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="/calibration"
        ><span class="brand-mark">e</span>EvoArm<span class="brand-sub"
          >/ 机械臂工作区</span
        ></a
      >
      <nav aria-label="主导航">
        <a href="/calibration">手动标定</a
        ><a href="/experiments" aria-current="page">试验记录</a>
      </nav>
      <span class="status-chip">观察 · 评估 · 调整</span>
    </header>
    <main>
      <div class="page-heading">
        <div>
          <div class="eyebrow">抓放任务 / 实测结果</div>
          <h1>让每次尝试都有依据。</h1>
          <p>
            记录是否抓起、是否入漏斗、是否在10秒内完成，以及下一次的调整建议。
          </p>
        </div>
        <span id="setupBadge" class="setup-badge"></span>
      </div>
      <div id="error" class="alert" role="alert" hidden></div>
      <section class="card trials-card">
        <div class="card-heading">
          <h2>当前布置的试次</h2>
          <span id="count" class="mini-badge">0 次</span>
        </div>
        <div id="emptyTrials" class="empty-trials">
          <span class="empty-cross">↗</span>
          <h2>还没有抓放试次</h2>
          <p>标定通过后，由本机控制 Agent 启动实物试验。完成的评估会列在这里。</p>
          <a class="button primary" href="/calibration">查看标定结果</a>
        </div>
        <div id="trials"></div>
      </section>
    </main>
    <footer>
      以实际录像与机械臂反馈判断结果；准备动作不计为抓取成功。
    </footer>
    <script>
      (async () => {
        try {
          const response = await fetch("/api/task/trials", {
            cache: "no-store",
          });
          if (!response.ok) throw Error("暂时无法读取试验记录");
          const data = await response.json();
          document.getElementById("setupBadge").textContent = data.setup_id;
          document.getElementById("count").textContent =
            data.trials.length + " 次";
          document.getElementById("emptyTrials").hidden =
            data.trials.length > 0;
          const label = (v) =>
            v === true ? "已观察到" : v === false ? "未观察到" : "无法确认";
          for (const trial of data.trials) {
            const row = document.createElement("article");
            row.className = "trial-row";
            const title = document.createElement("strong");
            title.textContent = "试次 " + trial.trial_id.slice(0, 10);
            const result = document.createElement("p");
            result.textContent = `抓起：${label(trial.pickup_observed)}　入漏斗：${label(trial.ball_entered_funnel)}　10秒内：${trial.within_10s === true ? "是" : trial.within_10s === false ? "否" : "未知"}`;
            row.append(title, result);
            for (const evidence of trial.evidence) {
              const note = document.createElement("p");
              note.className = "small-note";
              note.textContent = evidence;
              row.append(note);
            }
            document.getElementById("trials").append(row);
          }
        } catch (e) {
          const box = document.getElementById("error");
          box.textContent = e.message;
          box.hidden = false;
        }
      })();
    </script>
  </body>
</html>
